name: Chatbot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write # required to publish the image to GHCR

jobs:
  test_and_lint:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check app/

      - name: Run Pytest Suite
        run: python -m pytest -v

  security_scan:
    name: Build, Scan & Publish
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (scan candidate)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: chatbot-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan (HIGH/CRITICAL guardrail)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: chatbot-api:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fails build on fixable HIGH or CRITICAL CVEs
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tatva06/chatbot-cicd-pipeline:latest
            ghcr.io/tatva06/chatbot-cicd-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify
    needs: [test_and_lint, security_scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send pipeline notification
        env:
          WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          TESTS: ${{ needs.test_and_lint.result }}
          SCAN: ${{ needs.security_scan.result }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE: ghcr.io/tatva06/chatbot-cicd-pipeline
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "NOTIFICATION_WEBHOOK not set, skipping."; exit 0; fi
          SHORT="${SHA:0:7}"
          if [ "$EVENT" = "pull_request" ]; then SOURCE="PR #$PR_NUMBER"; else SOURCE="main"; fi

          if [ "$TESTS" = "failure" ]; then
            STAGE="Unit tests / lint"
            HINT="Run pytest and ruff locally and fix the failing assertion or lint error."
          elif [ "$SCAN" = "failure" ]; then
            STAGE="Trivy security scan"
            HINT="Upgrade the vulnerable package in requirements.txt or update the base image in the Dockerfile."
          fi

          if [ -n "${STAGE:-}" ]; then
            MSG="🚨 **PIPELINE BLOCKED** at **$STAGE**
          • Source: $SOURCE · Commit: \`$SHORT\`
          💡 **Advisor**: $HINT
          🔎 $RUN_URL"
          elif [ "$SCAN" = "success" ] && [ "$EVENT" = "pull_request" ]; then
            MSG="🟢 **$SOURCE passed all checks** (tests, lint, Trivy) and is safe to merge.
          🔎 $RUN_URL"
          elif [ "$SCAN" = "success" ]; then
            MSG="✅ **DEPLOYMENT SUCCESSFUL**
          • Service: \`chatbot-api\` · Commit: \`$SHORT\`
          • Artifact: \`$IMAGE:$SHA\`
          🔎 $RUN_URL"
          else
            echo "Run was cancelled or skipped; nothing to report."; exit 0
          fi

          # jq builds the JSON so quotes or newlines in the message can't break the payload
          jq -n --arg content "$MSG" '{content: $content}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
