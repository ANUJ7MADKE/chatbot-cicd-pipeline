name: Chatbot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write # required to publish the image to GHCR

jobs:
  test_and_lint:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check app/

      - name: Run Pytest Suite
        run: python -m pytest -v

  security_scan:
    name: Build, Scan & Publish
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (scan candidate)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: chatbot-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan (CRITICAL guardrail)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: chatbot-api:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fails build if CRITICAL CVEs are found
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tatva06/chatbot-cicd-pipeline:latest
            ghcr.io/tatva06/chatbot-cicd-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Deploy & Notify
    needs: [test_and_lint, security_scan]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Notify Webhook - Deployment Success
        if: ${{ needs.test_and_lint.result == 'success' && needs.security_scan.result == 'success' }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "✅ **DEPLOYMENT SUCCESSFUL**\n• Service: `chatbot-api`\n• Commit: `${{ github.sha }}`\n• Artifact: `ghcr.io/tatva06/chatbot-cicd-pipeline:${{ github.sha }}`\n• Status: Healthy & Serving"}' \
               "${{ secrets.NOTIFICATION_WEBHOOK }}"

      - name: Notify Webhook - Pipeline Failure & Remediation
        if: ${{ needs.test_and_lint.result == 'failure' || needs.security_scan.result == 'failure' }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚨 **PIPELINE BLOCKED: GUARDRAIL TRIGGERED**\n• Commit: `${{ github.sha }}`\n• Reason: Automated test failure or Critical CVE detected in container\n💡 **Advisor**: Review Pytest assertions or update base image in `Dockerfile`."}' \
               "${{ secrets.NOTIFICATION_WEBHOOK }}"
